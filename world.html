<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gidro World</title>
<meta name="description" content="Gidro World: explore Gidro's island, follow the learning path, earn tickets and decorate Gidro's room.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=Manrope:wght@600;700;800&display=swap">
<style>
:root{
  --ink:#1f2a44; --paper:#faf6ee; --card:#fff; --soft:#6b6459; --line:#ece6d4;
  --green:#3e8c63; --green-deep:#2f6e4c; --green-tint:#e1f0e6;
  --blue:#3a7ca5; --blue-deep:#2d6386; --blue-tint:#e3eef5;
  --coral:#b5651d; --coral-deep:#94530f; --coral-tint:#f6e6d6;
  --cta:#f4a940; --cta-deep:#c9831f; --red:#c8483b; --red-tint:#fbe3df;
  --cls:#e07a3f; --purple:#7a5ea8;
  --display:'Fraunces',Georgia,serif; --body:'Manrope','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1}
[hidden]{display:none!important}
.app{max-width:520px;margin:0 auto;min-height:100vh;position:relative}

/* top bar */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:max(10px,env(safe-area-inset-top)) 14px 10px;background:rgba(250,246,238,.94);backdrop-filter:blur(6px);border-bottom:2px solid var(--line)}
.top .who{display:flex;align-items:center;gap:8px;margin-right:auto;font-family:var(--display);font-weight:800;font-size:19px}
.top .who .av{width:44px;height:44px;border-radius:50%;background:var(--coral-tint);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden}
.top .who .av svg{width:46px;height:46px;margin-top:6px}
.pill{display:flex;align-items:center;gap:5px;font-weight:800;font-size:15px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:5px 11px;font-variant-numeric:tabular-nums}
.pill .tk{width:22px;height:16px}
.navbtn{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:6px 10px;font-weight:800;font-size:13px;display:flex;align-items:center;gap:5px}

/* world map */
.map{position:relative;margin:14px;border-radius:28px;overflow:hidden;box-shadow:0 6px 0 #d9d0b8;aspect-ratio:400/700;background:#8fd0e8}
.map > svg{position:absolute;inset:0;width:100%;height:100%}
.place{position:absolute;transform:translate(-50%,-50%);border:none;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:3px;width:23%}
.place .ic{width:100%;aspect-ratio:1;border-radius:26px;background:var(--card);box-shadow:0 5px 0 rgba(31,42,68,.25);display:flex;align-items:center;justify-content:center;border:3px solid #fff;transition:transform .15s}
.place .ic svg{width:82%;height:82%}
.place:active .ic{transform:scale(.94)}
.place .lb{background:var(--ink);color:#fff;font-weight:800;font-size:12.5px;border-radius:10px;padding:3px 8px;text-align:center;line-height:1.15;white-space:nowrap}
.place .lb small{display:block;font-weight:700;font-size:10.5px;opacity:.75}
.place.big{width:29%}
.place .ic.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 5px 0 rgba(31,42,68,.25),0 0 0 0 rgba(244,169,64,.8)}50%{box-shadow:0 5px 0 rgba(31,42,68,.25),0 0 0 10px rgba(244,169,64,0)}}

.bubble{margin:0 14px 18px;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:12px 14px;display:flex;gap:10px;align-items:center}
.bubble svg{width:52px;height:52px;flex-shrink:0}
.bubble p{margin:0;font-weight:700}
.bubble p b{font-family:var(--display)}

/* buttons */
.btn{border:none;border-radius:16px;padding:14px 18px;font-weight:800;font-size:17px;width:100%;background:var(--cta);color:var(--ink);box-shadow:0 4px 0 var(--cta-deep);text-align:center;text-decoration:none;display:block}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--cta-deep)}
.btn.green{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-deep)}
.btn.blue{background:var(--blue);color:#fff;box-shadow:0 4px 0 var(--blue-deep)}
.btn.ghost{background:var(--card);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn[disabled]{opacity:.45;pointer-events:none}

/* sheet (place menu) */
.veil{position:fixed;inset:0;background:rgba(31,42,68,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:520px;border-radius:28px 28px 0 0;padding:20px 18px max(22px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet .sh{display:flex;align-items:center;gap:12px}
.sheet .sh .ic{width:64px;height:64px;border-radius:18px;background:var(--card);border:2px solid var(--line);display:flex;align-items:center;justify-content:center}
.sheet .sh .ic svg{width:52px;height:52px}
.sheet h2{font-size:24px}
.sheet .sub{color:var(--soft);font-weight:700;margin:2px 0 0}
.act{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px;text-align:left;box-shadow:0 3px 0 var(--line)}
.act .e{font-size:30px;width:44px;text-align:center}
.act b{display:block;font-size:16px}
.act span{color:var(--soft);font-weight:700;font-size:13.5px}

/* learning path */
.pathwrap{padding:6px 14px 30px}
.pathhead{display:flex;align-items:center;gap:10px;margin:10px 0 6px}
.pathhead h2{font-size:26px;margin-right:auto}
.road{position:relative;background:linear-gradient(#bfe6c9,#e9f3d6);border-radius:28px;overflow:hidden;box-shadow:0 6px 0 #c9d8b2}
.road > svg{position:absolute;inset:0;width:100%;height:100%}
.stone{position:absolute;transform:translate(-50%,-50%);width:15%;aspect-ratio:1;border-radius:50%;border:none;font-family:var(--display);font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center;background:#fff;color:var(--ink);box-shadow:0 5px 0 rgba(31,42,68,.25)}
.stone .ee{font-size:22px}
.stone.done{background:var(--green);color:#fff}
.stone.now{background:var(--cta);animation:pulse 1.6s infinite;width:18%}
.stone.lock{background:#e9e4d6;color:#b3ab98;box-shadow:0 4px 0 #d3ccb9}
.stone.chest{border-radius:18px}
.stone .tag{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-family:var(--body);font-size:11px;font-weight:800;white-space:nowrap;background:rgba(255,255,255,.9);border-radius:8px;padding:1px 6px;color:var(--ink)}
.walker{position:absolute;transform:translate(-50%,-100%);width:16%;pointer-events:none;transition:left .9s ease,top .9s ease;filter:drop-shadow(0 3px 0 rgba(0,0,0,.15))}

/* play screen */
.play{position:fixed;inset:0;z-index:50;background:var(--paper);overflow:auto}
.play .in{max-width:520px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 16px 30px;display:flex;flex-direction:column;gap:14px;min-height:100%}
.phead{display:flex;align-items:center;gap:10px}
.x{border:2px solid var(--line);background:var(--card);border-radius:14px;width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.x svg{width:20px;height:20px}
.dots{display:flex;gap:6px;margin-right:auto}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--green)}
.ptitle{text-align:center}
.ptitle h2{font-size:26px}
.ptitle p{margin:4px 0 0;color:var(--soft);font-weight:700}
.say{align-self:center;border:none;background:var(--blue);color:#fff;border-radius:50%;width:84px;height:84px;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 0 var(--blue-deep)}
.say svg{width:40px;height:40px}
.say:active{transform:translateY(3px);box-shadow:0 2px 0 var(--blue-deep)}
.say.talk{animation:talk .5s ease-in-out infinite alternate}
@keyframes talk{to{transform:scale(1.07)}}

.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.opts.two{grid-template-columns:repeat(2,1fr)}
.opt{border:3px solid var(--line);background:var(--card);border-radius:20px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 4px 0 var(--line);min-height:120px;justify-content:center}
.opt .cap{font-weight:800;font-size:14px;min-height:1.2em;text-align:center;line-height:1.15}
.opt .cap small{display:block;color:var(--soft);font-weight:700;font-size:12px}
.opt.right{border-color:var(--green);background:var(--green-tint)}
.opt.wrong{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

.pic{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:14px;overflow:hidden;background:#fff}
.pic img{width:100%;height:100%;object-fit:cover}
.pic .em{font-size:58px;line-height:1}
.pic svg{width:86%;height:86%}
.pic .sw{width:78%;height:78%;border-radius:50%;border:3px solid rgba(0,0,0,.12)}
.pic .dotsn{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;width:86%}
.pic .dotsn i{width:15px;height:15px;border-radius:50%;background:var(--cls)}

/* themed backdrops for games */
.scene{border-radius:24px;padding:14px;position:relative}
.scene.market{background:repeating-linear-gradient(90deg,#f6e6d6 0 26px,#fbefe3 26px 52px);border:3px solid #e8cfb4}
.scene.market:before{content:"";position:absolute;left:0;right:0;top:-3px;height:22px;border-radius:24px 24px 0 0;background:repeating-linear-gradient(90deg,var(--red) 0 30px,#fff 30px 60px)}
.scene.house{background:#fde6d6;border:3px solid #f1c9a8}
.scene.garden{background:linear-gradient(#e1f0e6,#cfe8d6);border:3px solid #b9dcc4}
.scene.numbers{background:var(--blue-tint);border:3px solid #c5dbe9}
.scene.mix{background:#f0eaf7;border:3px solid #ddd0ee}
.scene > .opts{margin-top:10px}

/* market game */
.list{background:#fff;border:2px dashed var(--line);border-radius:16px;padding:10px;display:flex;gap:8px;align-items:center}
.list .lt{font-weight:800;font-size:13px;line-height:1.1;width:58px}
.list .lt small{display:block;color:var(--soft);font-weight:700}
.list .it{flex:1;position:relative}
.list .it.got:after{content:"✓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:44px;color:#fff;background:rgba(62,140,99,.75);border-radius:14px;font-weight:800}
.shelf{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.shelf .opt{min-height:0;padding:6px}
.shelf .opt.gone{visibility:hidden}
.basket{display:flex;align-items:center;gap:10px;justify-content:center;font-weight:800}
.basket .bk{width:86px;height:86px;border-radius:18px;overflow:hidden;background:#fff;border:2px solid var(--line)}
.basket .bk img{width:100%;height:100%;object-fit:cover}
.basket .bk.bump{animation:bump .35s}
@keyframes bump{50%{transform:scale(1.15)}}

/* paint game */
.canvasbox{background:#fff;border:3px solid var(--line);border-radius:24px;display:flex;align-items:center;justify-content:center;padding:14px}
.canvasbox svg{width:62%;height:auto}
.canvasbox svg .fillme{transition:fill .5s}
.pots{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.pot{width:66px;height:66px;border-radius:50%;border:4px solid #fff;box-shadow:0 4px 0 rgba(31,42,68,.2),0 0 0 2px var(--line)}
.pot.wrong{animation:shake .4s}
.pot.right{box-shadow:0 0 0 5px var(--green)}

/* memory */
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{aspect-ratio:3/4;border:none;padding:0;background:transparent;perspective:600px}
.card .f{display:block;position:relative;width:100%;height:100%;transition:transform .4s;transform-style:preserve-3d}
.card.open .f,.card.ok .f{transform:rotateY(180deg)}
.card .s{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;border:3px solid var(--line);overflow:hidden}
.card .back{background:var(--coral);border-color:#fff;box-shadow:0 4px 0 var(--coral-deep)}
.card .back svg{width:60%;height:60%;opacity:.9}
.card .front{background:#fff;transform:rotateY(180deg);padding:6px}
.card.ok .front{border-color:var(--green)}

/* move */
.mv{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 0}
.mv .big{font-size:110px;line-height:1;animation:bounce .6s ease-in-out infinite alternate}
@keyframes bounce{to{transform:translateY(-14px) rotate(4deg)}}
.mv .cnt{font-family:var(--display);font-size:46px;font-weight:800;color:var(--cls)}
.mv h3{font-size:28px}

/* celebration */
.yay{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding-top:20px}
.yay .stk{width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,#ffe7a8,#f4a940);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 8px 0 var(--cta-deep);animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.2)}}
.yay .stk svg{width:96px;height:96px}
.yay .stk b{font-family:var(--display);font-size:24px}
.yay h2{font-size:30px}
.yay .earn{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;background:#fff;border:2px solid var(--line);border-radius:999px;padding:8px 16px}
.yay .earn svg{width:30px;height:22px}

/* shop + room */
.sec{padding:4px 14px 30px;display:flex;flex-direction:column;gap:14px}
.sec h2{font-size:26px}
.tabs{display:flex;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:3px}
.tabs button{flex:1;border:none;background:none;border-radius:999px;padding:8px;font-weight:800;color:var(--soft)}
.tabs button[aria-pressed=true]{background:var(--ink);color:#fff}
.items{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.item{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 3px 0 var(--line)}
.item .iv{width:100%;aspect-ratio:1.3;border-radius:14px;background:var(--paper);display:flex;align-items:center;justify-content:center}
.item .iv svg{width:70%;height:90%}
.item b{font-size:15px;text-align:center;line-height:1.15}
.item b small{display:block;color:var(--soft);font-weight:700;font-size:12px}
.item .buy{border:none;border-radius:12px;padding:8px 12px;font-weight:800;background:var(--cta);box-shadow:0 3px 0 var(--cta-deep);display:flex;align-items:center;gap:5px;width:100%;justify-content:center}
.item .buy svg{width:22px;height:16px}
.item .buy.own{background:var(--green-tint);box-shadow:0 3px 0 #b9dcc4;color:var(--green-deep)}
.item .buy.on{background:var(--green);color:#fff;box-shadow:0 3px 0 var(--green-deep)}
.item .buy.poor{background:#eee8da;box-shadow:none;color:#a39b88}
.room{position:relative;border-radius:26px;overflow:hidden;box-shadow:0 6px 0 #d9c3a3;aspect-ratio:360/300;background:#f3d9b5}
.room > svg{position:absolute;inset:0;width:100%;height:100%}
.room .gd{position:absolute;left:50%;bottom:6%;width:30%;transform:translateX(-50%);animation:sway 2.4s ease-in-out infinite alternate}
@keyframes sway{to{transform:translateX(-50%) rotate(3deg)}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:800;border-radius:999px;padding:10px 18px;z-index:90;animation:up .2s}
.conf{position:fixed;z-index:95;pointer-events:none;font-size:26px;animation:fall 1.3s ease-in forwards}
@keyframes fall{to{transform:translateY(70vh) rotate(360deg);opacity:0}}
.flyt{position:fixed;z-index:96;pointer-events:none;font-weight:800;color:var(--cta-deep);font-size:22px;animation:flyup 1s ease-out forwards}
@keyframes flyup{to{transform:translateY(-60px);opacity:0}}
.note{font-size:13px;color:var(--soft);font-weight:700;text-align:center;margin:0 14px 24px}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="who"><span class="av" id="topAv"></span><span>Gidro World</span></div>
    <span class="pill" title="Tickets"><span id="tkIcon"></span><span id="tkN">0</span></span>
    <button class="navbtn" id="homeBtn" hidden>🏝️ Map</button>
  </header>

  <!-- WORLD MAP -->
  <main id="scrMap">
    <div class="map" id="map"></div>
    <div class="bubble"><span id="bubG"></span><p id="bubT"></p></div>
    <p class="note">Words, photos and voice come from the Gidro School lessons (Tsena and Fianakaviako books).</p>
  </main>

  <!-- LEARNING PATH -->
  <main id="scrPath" hidden>
    <div class="pathwrap">
      <div class="pathhead"><h2>Learning Path</h2><span class="pill" id="pathCount"></span></div>
      <div class="road" id="road"></div>
    </div>
  </main>

  <!-- SHOP -->
  <main id="scrShop" hidden>
    <div class="sec">
      <h2>Fivarotana <span style="font-size:17px;color:var(--soft)">- Ticket shop</span></h2>
      <div class="tabs"><button id="tabWear" aria-pressed="true">For Gidro</button><button id="tabRoom" aria-pressed="false">For the room</button></div>
      <div class="items" id="items"></div>
    </div>
  </main>

  <!-- ROOM -->
  <main id="scrRoom" hidden>
    <div class="sec">
      <h2>Tranon'i Gidro <span style="font-size:17px;color:var(--soft)">- Gidro's room</span></h2>
      <div class="room" id="room"></div>
      <button class="btn" id="roomShop">Get more things in the shop</button>
    </div>
  </main>
</div>

<div class="veil" id="veil" hidden><div class="sheet" id="sheet"></div></div>
<div class="play" id="play" hidden><div class="in" id="playIn"></div></div>

<!-- Word list, photos and voice list: the same file Gidro School uses -->
<script src="school-content.js"></script>
<script>
/* ================= basics ================= */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const W = id => (typeof WORDS !== 'undefined' && WORDS[id]) || { mg:id, en:id };
const hasPhoto = id => typeof PHOTO !== 'undefined' && PHOTO.has(id);
const hasVoice = id => typeof VOICE !== 'undefined' && VOICE.has(id);

const KEY = 'gidroWorld.v1';
const S = Object.assign({ tickets: 10, step: 0, owned: [], wear: {}, room: [] }, (() => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } })());
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

/* ================= sound ================= */
let cur = null;
function playFile(src, max = 6000){
  return new Promise(res => {
    try { if (cur) { cur.pause(); } } catch (e) {}
    let done = false; const fin = () => { if (!done) { done = true; res(); } };
    try {
      const a = new Audio(src); cur = a;
      a.onended = fin; a.onerror = fin; setTimeout(fin, max);
      const p = a.play(); if (p && p.catch) p.catch(fin);
    } catch (e) { fin(); }
  });
}
const sayWord = id => hasVoice(id) ? playFile(id + '.mp3') : Promise.resolve();
const sayEn = name => playFile('en-' + name + '.mp3');
const PRAISE = ['greatjob', 'wonderful', 'fantastic', 'welldone'];
let AC = null;
function tone(f, t = .18, when = 0, type = 'triangle', vol = .12){
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain(), s = AC.currentTime + when;
    o.type = type; o.frequency.value = f; g.gain.setValueAtTime(vol, s); g.gain.exponentialRampToValueAtTime(.001, s + t);
    o.connect(g); g.connect(AC.destination); o.start(s); o.stop(s + t + .02);
  } catch (e) {}
}
const ding = () => { tone(784, .15); tone(1047, .25, .1); };
const boop = () => tone(196, .22, 0, 'sine', .15);

/* ---------- learning path ---------- */
function stonePos(i, n){
  const rowH = 100 / (n + 1);
  const y = 100 - (i + 1) * rowH;  /* bottom to top */
  const x = 50 + 30 * Math.sin(i * 0.9);
  return { x, y };
}
function drawPath(){
  const n = PATH.length, H = n * 92 + 80;
  $('road').style.height = H + 'px';
  $('pathCount').innerHTML = `${Math.min(S.step, n)} / ${n}`;
  let d = '';
  for (let i = 0; i < n; i++) { const p = stonePos(i, n); d += (i ? ' L ' : 'M ') + (p.x * 4) + ' ' + (p.y * H / 100); }
  let h = `<svg viewBox="0 0 400 ${H}" preserveAspectRatio="none" aria-hidden="true">
     <path d="${d}" stroke="#e8cf98" stroke-width="26" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
     <path d="${d}" stroke="#fff6dc" stroke-width="3" stroke-dasharray="8 10" fill="none"/></svg>`;
  PATH.forEach((a, i) => {
    const p = stonePos(i, n), cls = i < S.step ? 'done' : i === S.step ? 'now' : 'lock';
    const chest = a === 'CHEST';
    const label = chest ? '🎁' : (i < S.step ? '★' : (i === S.step ? `<span class="ee">${A[a].e}</span>` : i + 1));
    h += `<button class="stone ${cls}${chest ? ' chest' : ''}" style="left:${p.x}%;top:${p.y}%" data-i="${i}" aria-label="Step ${i + 1}">${label}${i === S.step ? `<span class="tag">${chest ? 'Treasure!' : esc(A[a].t)}</span>` : ''}</button>`;
  });
  const wp = stonePos(Math.min(S.step, n - 1), n);
  h += `<div class="walker" style="left:${wp.x}%;top:calc(${wp.y}% - 22px)">${gidro()}</div>`;
  $('road').innerHTML = h;
  $('road').querySelectorAll('.stone').forEach(b => b.onclick = () => {
    const i = +b.dataset.i;
    if (i > S.step) { boop(); toast('Finish the glowing step first'); return; }
    const a = PATH[i];
    if (a === 'CHEST') { if (i === S.step) openChest(); else toast('You opened this chest already'); return; }
    startAct(a, i === S.step ? i : null);
  });
  if (S.step >= n) { $('road').insertAdjacentHTML('beforeend', ''); }
  /* scroll so the current stone is visible */
  setTimeout(() => { const now = $('road').querySelector('.stone.now'); if (now) now.scrollIntoView({ block:'center', behavior:'smooth' }); }, 80);
}
function openChest(){
  confetti(26); chaching();
  addTickets(15);
  S.step++; save();
  sheet(`<div style="text-align:center;font-size:90px;line-height:1">🎁</div><h2 style="text-align:center">Treasure chest!</h2>
    <p style="text-align:center;font-weight:800;margin:0;display:flex;gap:6px;justify-content:center;align-items:center">You found 15 ${TICKET.replace('class="tk"','style="width:30px;height:22px"')}</p>
    <button class="btn green" data-close>Keep going</button>`);
  drawPath();
}
function addTickets(n){ S.tickets += n; save(); refreshTop(); }

/* ================= play engine ================= */
let playing = null;
function startAct(aid, pathIndex){
  const a = A[aid];
  playing = { aid, a, pathIndex, earned: 0, firstTry: true };
  $('play').hidden = false; document.body.style.overflow = 'hidden';
  ({ find:playFind, market:playMarket, paint:playPaint, memory:playMemory, move:playMove })[a.k](a);
}
function stopPlay(){
  try { if (cur) cur.pause(); } catch (e) {}
  $('play').hidden = true; document.body.style.overflow = '';
  playing = null; mvStop = true;
}
function phead(total, doneN){
  let dots = ''; for (let i = 0; i < total; i++) dots += `<i class="${i < doneN ? 'on' : ''}"></i>`;
  return `<div class="phead"><button class="x" id="px" aria-label="Leave"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div class="dots">${dots}</div><span class="pill">${TICKET}<span>${S.tickets}</span></span></div>`;
}
function bindX(){ $('px').onclick = () => { stopPlay(); if (screen === 'path') drawPath(); }; }
const SPEAK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>';
function talk(btn, p){ btn.classList.add('talk'); return p.then(() => btn.classList.remove('talk')); }
function rightAnswer(el, extra = 0){
  ding(); const n = 1 + extra; playing.earned += n; addTickets(n); flyTicket(el, n);
  return playFile('en-' + pick(PRAISE) + '.mp3', 2500);
}
function wrongAnswer(el){ boop(); el.classList.remove('wrong'); void el.offsetWidth; el.classList.add('wrong'); }

function finish(){
  const p = playing; if (!p) return;
  const bonus = 3; addTickets(bonus); p.earned += bonus;
  if (p.pathIndex !== null && p.pathIndex === S.step) { S.step++; save(); }
  confetti();
  $('playIn').innerHTML = `<div class="yay">
    <div class="stk">${gidro()}<b>Mahay ianao!</b></div>
    <h2>Outstanding!</h2>
    <div class="earn">${TICKET.replace('class="tk"','')} +${p.earned} tickets</div>
    <button class="btn green" id="yNext">${p.pathIndex !== null ? 'Next on the path' : 'Play again'}</button>
    <button class="btn ghost" id="yMap">Back to the island</button></div>`;
  sayEn('outstanding');
  $('yNext').onclick = () => { const wasPath = p.pathIndex !== null; stopPlay(); if (wasPath) show('path'); else startAct(p.aid, null); };
  $('yMap').onclick = () => { stopPlay(); show(p.pathIndex !== null ? 'path' : 'map'); };
}

/* ---------- 1. listen and tap ---------- */
function playFind(a){
  const set = SETS[a.set], rounds = Math.min(5, set.length + 1);
  let r = 0, last = null;
  const round = () => {
    if (!playing) return;
    if (r >= rounds) return finish();
    let target; do { target = pick(set); } while (target === last && set.length > 1); last = target;
    const others = shuffle(set.filter(w => w !== target)).slice(0, 2);
    const opts = shuffle([target, ...others]);
    const voiced = hasVoice(target);
    $('playIn').innerHTML = phead(rounds, r) + `
      <div class="ptitle"><h2>${esc(a.t)}</h2><p>${voiced ? 'Listen to Gidro and tap the picture' : 'Find: ' + esc(W(target).en)}</p></div>
      <button class="say" id="sayB" aria-label="Listen again">${SPEAK}</button>
      <div class="scene ${a.th}"><div class="opts">${opts.map(w => `<button class="opt" data-w="${w}">${picOf(w)}<span class="cap"></span></button>`).join('')}</div></div>`;
    bindX();
    const sayB = $('sayB');
    const sayIt = () => talk(sayB, voiced ? sayWord(target) : sayEn('yourturn'));
    sayB.onclick = sayIt;
    let missed = false, locked = false;
    $('playIn').querySelectorAll('.opt').forEach(b => b.onclick = () => {
      if (locked) return;
      const w = b.dataset.w, x = W(w);
      if (w === target) {
        locked = true; b.classList.add('right');
        b.querySelector('.cap').innerHTML = `${esc(x.mg)}<small>${esc(x.en)}</small>`;
        rightAnswer(b, missed ? 0 : 1).then(() => sayWord(target)).then(() => { r++; setTimeout(round, 400); });
      } else {
        missed = true; wrongAnswer(b);
        b.querySelector('.cap').innerHTML = `${esc(x.mg)}<small>${esc(x.en)}</small>`;
        setTimeout(sayIt, 450);
      }
    });
    setTimeout(sayIt, 300);
  };
  if (a.th === 'garden') sayEn('howfeel').then(round); else round();
}

/* ---------- 2. market shopping ---------- */
function playMarket(a){
  const lists = 2; let li = 0;
  const one = () => {
    if (!playing) return;
    if (li >= lists) return finish();
    const shelf = shuffle(SETS[a.set]).slice(0, 6);
    const need = shuffle(shelf).slice(0, 3);
    const got = new Set();
    const draw = () => {
      $('playIn').innerHTML = phead(lists, li) + `
        <div class="ptitle"><h2>Market shopping</h2><p>Look at the lisitra (list). Put those things in the harona (basket).</p></div>
        <div class="list"><span class="lt">lisitra<small>list</small></span>${need.map(w => `<span class="it${got.has(w) ? ' got' : ''}" data-l="${w}">${picOf(w)}</span>`).join('')}</div>
        <div class="scene market"><div class="shelf">${shelf.map(w => `<button class="opt${got.has(w) ? ' gone' : ''}" data-w="${w}">${picOf(w)}</button>`).join('')}</div></div>
        <div class="basket"><span class="bk" id="bk">${hasPhoto('harona') ? '<img src="harona.webp" alt="basket">' : '<span style="font-size:60px">🧺</span>'}</span><span id="bkN">${got.size} / ${need.length}</span></div>`;
      bindX();
      $('playIn').querySelectorAll('.list .it').forEach(s => s.onclick = () => sayWord(s.dataset.l));
      $('playIn').querySelectorAll('.shelf .opt').forEach(b => b.onclick = () => {
        const w = b.dataset.w;
        if (need.includes(w) && !got.has(w)) {
          got.add(w); ding(); addTickets(1); playing.earned++; flyTicket(b);
          sayWord(w);
          b.classList.add('gone'); $('bk').classList.remove('bump'); void $('bk').offsetWidth; $('bk').classList.add('bump');
          $('bkN').textContent = `${got.size} / ${need.length}`;
          $('playIn').querySelector(`.it[data-l="${w}"]`).classList.add('got');
          if (got.size === need.length) setTimeout(pay, 900);
        } else { wrongAnswer(b); sayWord(w); }
      });
    };
    const pay = () => {
      $('playIn').innerHTML = phead(lists, li) + `
        <div class="ptitle"><h2>Time to pay!</h2><p>Tap the vola (money) to pay for your basket.</p></div>
        <button class="opt" id="payB" style="width:58%;align-self:center">${picOf('vola')}<span class="cap">vola<small>money</small></span></button>`;
      bindX();
      sayWord('vola');
      $('payB').onclick = () => { chaching(); $('payB').classList.add('right'); playFile('en-' + pick(PRAISE) + '.mp3', 2500).then(() => { li++; one(); }); };
    };
    draw();
    sayWord('lisitra');
  };
  one();
}

/* ---------- 3. listen and paint ---------- */
const SHAPE_SVG = {
  boribory: '<circle class="fillme" cx="50" cy="50" r="40"/>',
  efamira: '<rect class="fillme" x="12" y="12" width="76" height="76" rx="4"/>',
  telozoro: '<path class="fillme" d="M50 8L92 88H8z"/>',
  mahitsizoro: '<rect class="fillme" x="4" y="24" width="92" height="52" rx="4"/>'
};
function playPaint(a){
  const cols = SETS[a.set], rounds = 4; let r = 0, lastC = null;
  const round = () => {
    if (!playing) return;
    if (r >= rounds) return finish();
    let c; do { c = pick(cols); } while (c === lastC && cols.length > 1); lastC = c;
    const shape = a.shapes[r % a.shapes.length];
    const pots = shuffle(cols);
    $('playIn').innerHTML = phead(rounds, r) + `
      <div class="ptitle"><h2>${esc(a.t)}</h2><p>Listen to the color, then tap the paint</p></div>
      <button class="say" id="sayB" aria-label="Listen again">${SPEAK}</button>
      <div class="canvasbox"><svg viewBox="0 0 100 100"><g fill="#fff" stroke="#1f2a44" stroke-width="3" stroke-dasharray="6 5">${SHAPE_SVG[shape]}</g></svg></div>
      <p class="cap" id="shapeCap" style="text-align:center;margin:-4px 0 0;font-weight:800"></p>
      <div class="pots">${pots.map(p => `<button class="pot" data-c="${p}" style="background:${W(p).color}" aria-label="paint"></button>`).join('')}</div>`;
    bindX();
    const sayB = $('sayB');
    const sayIt = () => talk(sayB, (a.sayShape ? sayWord(shape) : Promise.resolve()).then(() => sayWord(c)));
    sayB.onclick = sayIt;
    let missed = false, locked = false;
    $('playIn').querySelectorAll('.pot').forEach(b => b.onclick = () => {
      if (locked) return;
      if (b.dataset.c === c) {
        locked = true; b.classList.add('right');
        const f = $('playIn').querySelector('.fillme'); f.style.fill = W(c).color; f.parentNode.setAttribute('stroke-dasharray', '0');
        $('shapeCap').innerHTML = `${esc(W(shape).mg)} ${esc(W(c).mg)} <span style="color:var(--soft)">- ${esc(W(c).en)} ${esc(W(shape).en)}</span>`;
        rightAnswer(b, missed ? 0 : 1).then(() => { r++; setTimeout(round, 600); });
      } else { missed = true; wrongAnswer(b); sayWord(b.dataset.c).then(() => setTimeout(sayIt, 300)); }
    });
    setTimeout(sayIt, 300);
  };
  round();
}

/* ---------- 4. memory pairs ---------- */
function playMemory(a){
  const words = shuffle(SETS[a.set]).slice(0, 3);
  const cards = shuffle([...words, ...words]);
  let open = [], matched = 0, busy = false;
  $('playIn').innerHTML = phead(3, 0) + `
    <div class="ptitle"><h2>${esc(a.t)}</h2><p>Turn two cards. Find the pairs!</p></div>
    <div class="mem">${cards.map((w, i) => `<button class="card" data-w="${w}" data-i="${i}"><span class="f"><span class="s back">${gidro({})}</span><span class="s front">${picOf(w)}</span></span></button>`).join('')}</div>`;
  bindX();
  sayEn('matchpairs');
  $('playIn').querySelectorAll('.card').forEach(c => c.onclick = () => {
    if (busy || c.classList.contains('open') || c.classList.contains('ok')) return;
    c.classList.add('open'); tone(660, .08); sayWord(c.dataset.w);
    open.push(c);
    if (open.length === 2) {
      busy = true;
      const [x, y] = open;
      if (x.dataset.w === y.dataset.w) {
        setTimeout(() => {
          x.classList.add('ok'); y.classList.add('ok'); matched++;
          rightAnswer(y);
          const dots = $('playIn').querySelectorAll('.dots i'); if (dots[matched - 1]) dots[matched - 1].classList.add('on');
          open = []; busy = false;
          if (matched === words.length) setTimeout(finish, 1400);
        }, 500);
      } else {
        setTimeout(() => { x.classList.remove('open'); y.classList.remove('open'); open = []; busy = false; }, 1100);
      }
    }
  });
}

/* ---------- 5. music and movement (the same 6 actions as Gidro School) ---------- */
let mvStop = false;
function playMove(){
  const acts = [
    { v:'jump', t:'Jump!', e:'🦘' }, { v:'clap', t:'Clap your hands!', e:'👏🏾' }, { v:'turn', t:'Turn around!', e:'🔄' },
    { v:'run', t:'Run in place!', e:'🏃🏾' }, { v:'dance', t:'Dance!', e:'💃🏾' }, { v:'head', t:'Touch your head!', e:'🙆🏾' }
  ];
  mvStop = false;
  const tune = [523, 659, 784, 659, 587, 698, 880, 698];
  let i = 0;
  const step = async () => {
    if (mvStop || !playing) return;
    if (i >= acts.length) { sayEn('mvend'); return finish(); }
    const x = acts[i];
    $('playIn').innerHTML = phead(acts.length, i) + `<div class="mv"><div class="big">${x.e}</div><h3>${x.t}</h3><div class="cnt" id="cnt">5</div></div>`;
    bindX();
    await sayEn('mv-' + x.v);
    for (let s = 5; s > 0; s--) {
      if (mvStop || !playing) return;
      const c = $('cnt'); if (c) c.textContent = s;
      tone(tune[(s + i) % tune.length], .25, 0); tone(tune[(s + i + 2) % tune.length] / 2, .25, .25, 'sine', .08);
      await new Promise(r => setTimeout(r, 1000));
    }
    addTickets(1); playing.earned++;
    i++; step();
  };
  $('playIn').innerHTML = phead(acts.length, 0) + `<div class="mv"><div class="big">🎵</div><h3>Stand up and move with Gidro!</h3><button class="btn green" id="mvGo" style="max-width:260px">Start</button></div>`;
  bindX();
  sayEn('mvintro');
  $('mvGo').onclick = step;
}

const ROOMART = {

  ball: '<circle cx="292" cy="250" r="18" fill="#c8483b"/><path d="M276 244c10 4 22 4 32 0M280 260c8-3 18-3 26 0" stroke="#fff" stroke-width="3" fill="none"/>',
  books: '<rect x="248" y="96" width="86" height="8" fill="#8c5430"/><rect x="254" y="66" width="10" height="30" fill="#3a7ca5"/><rect x="266" y="70" width="10" height="26" fill="#c8483b"/><rect x="278" y="64" width="10" height="32" fill="#3e8c63"/><rect x="290" y="72" width="10" height="24" fill="#f4a940"/><path d="M304 96l10-28 8 3-10 25z" fill="#7a5ea8"/>',

  drum: '<path d="M60 224h44v34a5 5 0 0 1-5 5H65a5 5 0 0 1-5-5z" fill="#c8483b"/><ellipse cx="82" cy="224" rx="22" ry="7" fill="#fde6d6" stroke="#94530f" stroke-width="2"/><path d="M63 230l8 30M101 230l-8 30M82 232v31" stroke="#f4a940" stroke-width="2.5"/>',
  lamp: '<path d="M318 120v100" stroke="#1f2a44" stroke-width="3"/><ellipse cx="318" cy="222" rx="16" ry="5" fill="#1f2a44"/><path d="M332 106a20 20 0 1 1-16-26 16 16 0 0 0 16 26z" fill="#ffd166"/>',
  baobab: '<rect x="128" y="34" width="104" height="70" rx="4" fill="#f4a940"/><rect x="134" y="40" width="92" height="58" fill="#fbd9a8"/><circle cx="208" cy="54" r="7" fill="#e07a3f"/><rect x="175" y="64" width="10" height="34" fill="#8c5430"/><path d="M175 66c-8-2-12-8-10-14M185 66c8-2 12-8 10-14M180 64v-10" stroke="#8c5430" stroke-width="3" fill="none"/><circle cx="165" cy="50" r="6" fill="#3e8c63"/><circle cx="195" cy="50" r="6" fill="#3e8c63"/><circle cx="180" cy="48" r="7" fill="#3e8c63"/>'
};
const WEARPREV = { bow:{head:'bow'}, hat:{head:'hat'}, crown:{head:'crown'}, glasses:{eyes:'glasses'}, lamba:{neck:'lamba'}, medal:{neck:'medal'} };
let shopTab = 'wear';
function drawShop(){
  $('tabWear').setAttribute('aria-pressed', shopTab === 'wear'); $('tabRoom').setAttribute('aria-pressed', shopTab === 'room');
  $('items').innerHTML = ITEMS.filter(it => it.tab === shopTab).map(it => {
    const own = S.owned.includes(it.id);
    const on = it.tab === 'wear' ? S.wear[it.slot] === it.id : S.room.includes(it.id);
    const prev = it.tab === 'wear' ? gidro(WEARPREV[it.id]) : `<svg viewBox="0 0 360 300" aria-hidden="true">${ROOMART[it.id]}</svg>`;
    const btn = !own
      ? `<button class="buy${S.tickets < it.price ? ' poor' : ''}" data-buy="${it.id}">${TICKET} ${it.price}</button>`
      : `<button class="buy ${on ? 'on' : 'own'}" data-use="${it.id}">${on ? (it.tab === 'wear' ? 'Wearing ✓' : 'In the room ✓') : (it.tab === 'wear' ? 'Put on' : 'Put in room')}</button>`;
    return `<div class="item"><div class="iv">${prev}</div><b>${esc(it.en)}${it.mg ? `<small>${esc(it.mg)}</small>` : ''}</b>${btn}</div>`;
  }).join('');
  $('items').querySelectorAll('[data-buy]').forEach(b => b.onclick = () => buy(b.dataset.buy));
  $('items').querySelectorAll('[data-use]').forEach(b => b.onclick = () => useItem(b.dataset.use));
}
function buy(id){
  const it = ITEMS.find(x => x.id === id);
  if (S.tickets < it.price) { boop(); toast(`You need ${it.price - S.tickets} more tickets. Play a game!`); return; }
  S.tickets -= it.price; S.owned.push(id); chaching(); confetti(10);
  useItem(id, true);
  toast(it.tab === 'wear' ? 'Gidro loves it!' : 'Added to Gidro\'s room!');
}
function useItem(id, forceOn){
  const it = ITEMS.find(x => x.id === id);
  if (it.tab === 'wear') { S.wear[it.slot] = (S.wear[it.slot] === id && !forceOn) ? null : id; }
  else { const k = S.room.indexOf(id); if (k >= 0 && !forceOn) S.room.splice(k, 1); else if (k < 0) S.room.push(id); }
  save(); refreshTop(); drawShop();
}
$('tabWear').onclick = () => { shopTab = 'wear'; drawShop(); };
$('tabRoom').onclick = () => { shopTab = 'room'; drawShop(); };

/* ================= Gidro's room ================= */
function drawRoom(){
  const order = ['baobab','books','lamp','rug','plant','drum','ball'];
  let art = order.filter(k => S.room.includes(k)).map(k => ROOMART[k]).join('');
  $('room').innerHTML = `<svg viewBox="0 0 360 300" aria-hidden="true">
     <rect width="360" height="300" fill="#f6dcb5"/>
     <g stroke="#e9c896" stroke-width="2">${Array.from({length:9}, (_, i) => `<path d="M${i * 45} 0v210"/>`).join('')}</g>
     <rect y="210" width="360" height="90" fill="#c99360"/>
     <g stroke="#b5814f" stroke-width="2">${Array.from({length:5}, (_, i) => `<path d="M0 ${226 + i * 16}h360"/>`).join('')}</g>
     <rect x="24" y="40" width="80" height="80" rx="40" fill="#9edcf0" stroke="#8c5430" stroke-width="6"/><path d="M64 40v80M24 80h80" stroke="#8c5430" stroke-width="4"/><circle cx="84" cy="62" r="8" fill="#ffd166"/>
     ${art}</svg><div class="gd">${gidro()}</div>`;
  if (!S.room.length) $('room').insertAdjacentHTML('beforeend', '<p style="position:absolute;left:0;right:0;top:44%;text-align:center;font-weight:800;color:#94530f;margin:0">The room is empty. Buy things in the shop!</p>');
}
$('roomShop').onclick = () => { shopTab = 'room'; show('shop'); };

/* ================= start ================= */
$('tkIcon').innerHTML = TICKET;
$('homeBtn').onclick = () => show('map');
refreshTop();

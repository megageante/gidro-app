<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gidro</title>
<meta name="description" content="Gidro: learn Malagasy with Gidro, Lova and Tiana. Games, books and music for children 2 to 8.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=Manrope:wght@600;700;800&display=swap">
<style>
:root{
  --ink:#1f2a44; --paper:#faf6ee; --card:#fff; --soft:#6b6459; --line:#ece6d4;
  --green:#3e8c63; --green-deep:#2f6e4c; --green-tint:#e1f0e6;
  --blue:#3a7ca5; --blue-deep:#2d6386; --blue-tint:#e3eef5;
  --coral:#b5651d; --coral-deep:#94530f; --coral-tint:#f6e6d6;
  --cta:#f4a940; --cta-deep:#c9831f; --red:#c8483b; --red-tint:#fbe3df;
  --cls:#e07a3f; --purple:#7a5ea8; --purple-tint:#efe9f7;
  --display:'Fraunces',Georgia,serif; --body:'Manrope','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1}
[hidden]{display:none!important}
.app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:max(20px,env(safe-area-inset-bottom))}

/* top bar */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:max(10px,env(safe-area-inset-top)) 14px 10px;background:rgba(250,246,238,.95);backdrop-filter:blur(6px)}
.who{display:flex;align-items:center;gap:8px;margin-right:auto;border:none;background:none;padding:0;text-align:left;min-width:0}
.who .av{width:44px;height:44px;border-radius:50%;background:var(--coral-tint);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.who .av svg{width:46px;height:46px;margin-top:6px}
.who b{font-family:var(--display);font-size:18px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{display:block;font-weight:800;font-size:12px;color:var(--soft)}
.pill{display:flex;align-items:center;gap:5px;font-weight:800;font-size:15px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:5px 11px;font-variant-numeric:tabular-nums}
.pill .tk{width:22px;height:16px}
.navbtn{border:2px solid var(--line);background:var(--card);border-radius:14px;height:40px;min-width:40px;padding:0 9px;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;gap:5px}
.navbtn svg{width:20px;height:20px}

/* home */
.stage{position:relative;margin:4px 14px 0;border-radius:30px;overflow:hidden;aspect-ratio:400/290;box-shadow:0 6px 0 #d7ceb6}
.stage > svg{position:absolute;inset:0;width:100%;height:100%}
.chr{position:absolute;bottom:17%;transform:translateX(-50%);border:none;background:none;padding:0}
.chr svg,.chr img{width:100%;height:auto;display:block}
.chr.lova{left:20%;width:21%}
.chr.tiana{left:80%;width:21%}
.chr.gidro{left:50%;width:27%;bottom:15%}
.chr.hop{animation:hop .5s}
@keyframes hop{40%{transform:translateX(-50%) translateY(-14px)}}
.say{position:absolute;top:6%;background:#fff;border-radius:18px;padding:8px 12px;font-weight:800;font-size:14px;line-height:1.25;max-width:62%;box-shadow:0 3px 0 rgba(31,42,68,.15);animation:up .25s}
.say:after{content:"";position:absolute;bottom:-9px;width:18px;height:18px;background:#fff;transform:rotate(45deg);left:var(--tail,50%)}
.say small{display:block;color:var(--soft);font-weight:700;font-size:12px}
.playwrap{display:flex;flex-direction:column;align-items:center;margin-top:-46px;position:relative;z-index:2}
.play{width:112px;height:112px;border-radius:50%;border:6px solid #fff;background:var(--green);box-shadow:0 7px 0 var(--green-deep);display:flex;align-items:center;justify-content:center;animation:breathe 2.2s ease-in-out infinite}
.play svg{width:48px;height:48px;margin-left:8px}
.play:active{transform:translateY(4px);box-shadow:0 3px 0 var(--green-deep)}
@keyframes breathe{50%{transform:scale(1.05)}}
.playlbl{margin-top:8px;font-weight:800;text-align:center;line-height:1.2}
.playlbl small{display:block;color:var(--soft);font-weight:700;font-size:13px}
.minilink{border:none;background:none;color:var(--blue-deep);font-weight:800;font-size:14px;text-decoration:underline;padding:4px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:14px}
.tile{border:none;border-radius:24px;padding:12px;display:flex;align-items:center;gap:10px;text-align:left;color:#fff;box-shadow:0 5px 0 rgba(31,42,68,.25);text-decoration:none}
.tile .ti{width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tile .ti svg{width:40px;height:40px}
.tile b{display:block;font-family:var(--display);font-size:17px;line-height:1.1}
.tile small{display:block;font-weight:700;font-size:12px;opacity:.9}
.tile.lib{background:var(--purple)}
.tile.cls{background:var(--cls)}
.tile.shp{background:var(--blue)}
.tile.rm{background:var(--green)}

/* library */
.sec{padding:4px 14px 30px;display:flex;flex-direction:column;gap:14px}
.sec h2{font-size:26px}
.sec h2 span{font-size:17px;color:var(--soft)}
.shelves{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.shelves::-webkit-scrollbar{display:none}
.shelf{flex-shrink:0;border:2px solid var(--line);background:var(--card);border-radius:18px;padding:8px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:800;font-size:13px;line-height:1.1;min-width:84px}
.shelf .se{font-size:26px}
.shelf small{font-weight:700;font-size:11px;color:var(--soft)}
.shelf[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.shelf[aria-pressed=true] small{color:#cfd5e2}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.lc{position:relative;border:2px solid var(--line);background:var(--card);border-radius:22px;padding:10px;display:flex;flex-direction:column;gap:8px;text-align:left;box-shadow:0 4px 0 var(--line)}
.lc .cv{aspect-ratio:1.25;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:52px;overflow:hidden}
.lc .cv img{width:100%;height:100%;object-fit:cover}
.lc .cv svg{width:62%;height:auto}
.lc b{font-size:15px;line-height:1.15}
.lc small{display:block;color:var(--soft);font-weight:700;font-size:12.5px}
.lc .lock{position:absolute;top:14px;right:14px;background:var(--ink);color:#fff;border-radius:999px;font-size:12px;font-weight:800;padding:3px 8px}
.lc .dn{position:absolute;top:14px;left:14px;background:var(--green);color:#fff;border-radius:999px;font-size:12px;font-weight:800;padding:3px 8px}

/* buttons */
.btn{border:none;border-radius:16px;padding:14px 18px;font-weight:800;font-size:17px;width:100%;background:var(--cta);color:var(--ink);box-shadow:0 4px 0 var(--cta-deep);text-align:center;text-decoration:none;display:block}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--cta-deep)}
.btn.green{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-deep)}
.btn.blue{background:var(--blue);color:#fff;box-shadow:0 4px 0 var(--blue-deep)}
.btn.ghost{background:var(--card);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}

/* sheets */
.veil{position:fixed;inset:0;background:rgba(31,42,68,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:520px;border-radius:28px 28px 0 0;padding:20px 18px max(22px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;animation:up .25s ease-out;max-height:92vh;overflow:auto}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.sheet h2{font-size:24px}
.sheet p{margin:0;font-weight:700}
.sheet .muted{color:var(--soft)}
.ages{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.ages button{border:3px solid var(--line);background:#fff;border-radius:20px;padding:10px 4px;font-family:var(--display);font-size:30px;font-weight:800;box-shadow:0 4px 0 var(--line)}
.ages button small{display:block;font-family:var(--body);font-size:11px;font-weight:800;color:var(--soft)}
.ages button[aria-pressed=true]{border-color:var(--green);background:var(--green-tint)}
.field{display:flex;flex-direction:column;gap:6px;font-weight:800}
.field input{border:2px solid var(--line);border-radius:14px;padding:12px;font-size:18px;background:#fff}
.hold{position:relative;overflow:hidden}
.hold i{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,255,255,.35)}
.row{display:flex;gap:10px;align-items:center}
.guide{display:flex;gap:10px;align-items:flex-end}
.guide .gp{width:70px;flex-shrink:0}
.guide .gp svg,.guide .gp img{width:100%;height:auto;display:block}

/* learning path */
.road{position:relative;background:linear-gradient(#bfe6c9,#e9f3d6);border-radius:28px;overflow:hidden;box-shadow:0 6px 0 #c9d8b2}
.road > svg{position:absolute;inset:0;width:100%;height:100%}
.stone{position:absolute;transform:translate(-50%,-50%);width:15%;aspect-ratio:1;border-radius:50%;border:none;font-family:var(--display);font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center;background:#fff;color:var(--ink);box-shadow:0 5px 0 rgba(31,42,68,.25)}
.stone .ee{font-size:22px}
.stone.done{background:var(--green);color:#fff}
.stone.now{background:var(--cta);animation:pulse 1.6s infinite;width:18%}
.stone.lock{background:#e9e4d6;color:#b3ab98;box-shadow:0 4px 0 #d3ccb9}
.stone.chest{border-radius:18px}
.stone .tag{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-family:var(--body);font-size:11px;font-weight:800;white-space:nowrap;background:rgba(255,255,255,.92);border-radius:8px;padding:1px 6px;color:var(--ink)}
@keyframes pulse{0%,100%{box-shadow:0 5px 0 rgba(31,42,68,.25),0 0 0 0 rgba(244,169,64,.8)}50%{box-shadow:0 5px 0 rgba(31,42,68,.25),0 0 0 10px rgba(244,169,64,0)}}
.walker{position:absolute;transform:translate(-50%,-100%);width:16%;pointer-events:none;filter:drop-shadow(0 3px 0 rgba(0,0,0,.15))}

/* game screen */
.gscr{position:fixed;inset:0;z-index:50;background:var(--paper);overflow:auto}
.gin{max-width:520px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 16px 30px;display:flex;flex-direction:column;gap:14px;min-height:100%}
.phead{display:flex;align-items:center;gap:10px}
.x{border:2px solid var(--line);background:var(--card);border-radius:14px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.x svg{width:20px;height:20px}
.dots{display:flex;gap:6px;margin-right:auto;flex-wrap:wrap}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--green)}
.ptitle{text-align:center}
.ptitle h2{font-size:25px}
.ptitle p{margin:4px 0 0;color:var(--soft);font-weight:700}
.spk{align-self:center;border:none;background:var(--blue);color:#fff;border-radius:50%;width:84px;height:84px;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 0 var(--blue-deep)}
.spk svg{width:40px;height:40px}
.spk:active{transform:translateY(3px);box-shadow:0 2px 0 var(--blue-deep)}
.spk.talk{animation:talk .5s ease-in-out infinite alternate}
@keyframes talk{to{transform:scale(1.07)}}
.readw{align-self:center;background:#fff;border:3px solid var(--line);border-radius:20px;padding:12px 22px;font-family:var(--display);font-weight:800;font-size:32px;text-align:center;line-height:1.1}
.readw.small{font-size:22px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.opts.c2{grid-template-columns:repeat(2,1fr)}
.opts.c4{grid-template-columns:repeat(2,1fr)}
.opt{border:3px solid var(--line);background:var(--card);border-radius:20px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 4px 0 var(--line);justify-content:center}
.opt .cap{font-weight:800;font-size:14px;min-height:1.2em;text-align:center;line-height:1.15}
.opt .cap small{display:block;color:var(--soft);font-weight:700;font-size:12px}
.opt.right{border-color:var(--green);background:var(--green-tint)}
.wrong{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.pic{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:14px;overflow:hidden;background:#fff}
.pic img{width:100%;height:100%;object-fit:cover}
.pic .em{font-size:58px;line-height:1}
.pic svg{width:86%;height:86%}
.pic .sw{width:78%;height:78%;border-radius:50%;border:3px solid rgba(0,0,0,.12)}
.pic .dotsn{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;width:90%}
.pic .dotsn i{width:13px;height:13px;border-radius:50%;background:var(--cls)}
.pic .dotsn i:nth-child(n+11){background:var(--blue)}
.scene{border-radius:24px;padding:14px;position:relative}
.scene.market{background:repeating-linear-gradient(90deg,#f6e6d6 0 26px,#fbefe3 26px 52px);border:3px solid #e8cfb4;padding-top:26px}
.scene.market:before{content:"";position:absolute;left:0;right:0;top:-3px;height:18px;border-radius:24px 24px 0 0;background:repeating-linear-gradient(90deg,var(--red) 0 30px,#fff 30px 60px)}
.scene.house{background:#fde6d6;border:3px solid #f1c9a8}
.scene.garden{background:linear-gradient(#e1f0e6,#cfe8d6);border:3px solid #b9dcc4}
.scene.numbers{background:var(--blue-tint);border:3px solid #c5dbe9}
.scene.mix{background:var(--purple-tint);border:3px solid #ddd0ee}
.list{background:#fff;border:2px dashed var(--line);border-radius:16px;padding:10px;display:flex;gap:8px;align-items:center}
.list .lt{font-weight:800;font-size:13px;line-height:1.1;width:54px;flex-shrink:0}
.list .lt small{display:block;color:var(--soft);font-weight:700}
.list .it{flex:1;position:relative;border:none;background:none;padding:0}
.list .it.word{background:var(--paper);border-radius:12px;padding:12px 4px;font-weight:800;text-align:center;font-size:15px}
.list .it.got:after{content:"✓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:40px;color:#fff;background:rgba(62,140,99,.78);border-radius:14px;font-weight:800}
.shelfg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.shelfg .opt{padding:6px}
.shelfg .opt.gone{visibility:hidden}
.basket{display:flex;align-items:center;gap:10px;justify-content:center;font-weight:800}
.basket .bk{width:80px;height:80px;border-radius:18px;overflow:hidden;background:#fff;border:2px solid var(--line)}
.basket .bk img{width:100%;height:100%;object-fit:cover}
.basket .bk.bump{animation:bump .35s}
@keyframes bump{50%{transform:scale(1.15)}}
.canvasbox{background:#fff;border:3px solid var(--line);border-radius:24px;display:flex;align-items:center;justify-content:center;padding:14px}
.canvasbox svg{width:58%;height:auto}
.canvasbox svg .fillme{transition:fill .5s}
.pots{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.pot{width:66px;height:66px;border-radius:50%;border:4px solid #fff;box-shadow:0 4px 0 rgba(31,42,68,.2),0 0 0 2px var(--line)}
.pot.right{box-shadow:0 0 0 5px var(--green)}
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mem.c2{grid-template-columns:repeat(2,1fr);padding:0 8%}
.mem.c4{grid-template-columns:repeat(4,1fr)}
.card{aspect-ratio:3/4;border:none;padding:0;background:transparent;perspective:600px}
.card .f{display:block;position:relative;width:100%;height:100%;transition:transform .4s;transform-style:preserve-3d}
.card.open .f,.card.ok .f{transform:rotateY(180deg)}
.card .s{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;justify-content:center;border:3px solid var(--line);overflow:hidden}
.card .back{background:var(--coral);border-color:#fff;box-shadow:0 4px 0 var(--coral-deep)}
.card .back svg{width:60%;height:60%;opacity:.9}
.card .front{background:#fff;transform:rotateY(180deg);padding:6px}
.card .front .wd{font-family:var(--display);font-weight:800;font-size:17px;text-align:center;line-height:1.1;word-break:break-word}
.card.ok .front{border-color:var(--green)}
.mv{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 0;text-align:center}
.mv .big{font-size:110px;line-height:1;animation:bounce .6s ease-in-out infinite alternate}
@keyframes bounce{to{transform:translateY(-14px) rotate(4deg)}}
.mv .cnt{font-family:var(--display);font-size:46px;font-weight:800;color:var(--cls)}
.mv h3{font-size:28px}
.book{background:#fff;border:3px solid var(--line);border-radius:26px;overflow:hidden;box-shadow:0 5px 0 var(--line)}
.book .bs{background:linear-gradient(#e3eef5,#fde6d6);display:flex;align-items:flex-end;justify-content:center;gap:10px;padding:18px 10px 14px;min-height:190px;font-size:64px;line-height:1}
.book .bs .g{width:110px}
.book .bt{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px}
.book .mg{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.25}
.book .en{color:var(--soft);font-weight:700;font-size:16px}
.yay{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding-top:10px}
.yay .stk{width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,#ffe7a8,#f4a940);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 8px 0 var(--cta-deep);animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.2)}}
.yay .stk svg{width:86px;height:86px}
.yay .stk b{font-family:var(--display);font-size:24px}
.yay h2{font-size:28px}
.yay .earn{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;background:#fff;border:2px solid var(--line);border-radius:999px;padding:8px 16px}
.yay .earn svg{width:30px;height:22px}

/* shop + room */
.tabs{display:flex;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:3px}
.tabs button{flex:1;border:none;background:none;border-radius:999px;padding:8px;font-weight:800;color:var(--soft)}
.tabs button[aria-pressed=true]{background:var(--ink);color:#fff}
.items{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.item{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 3px 0 var(--line)}
.item .iv{width:100%;aspect-ratio:1.3;border-radius:14px;background:var(--paper);display:flex;align-items:center;justify-content:center}
.item .iv svg{width:70%;height:90%}
.item b{font-size:15px;text-align:center;line-height:1.15}
.item b small{display:block;color:var(--soft);font-weight:700;font-size:12px}
.buy{border:none;border-radius:12px;padding:8px 12px;font-weight:800;background:var(--cta);box-shadow:0 3px 0 var(--cta-deep);display:flex;align-items:center;gap:5px;width:100%;justify-content:center}
.buy svg{width:22px;height:16px}
.buy.own{background:var(--green-tint);box-shadow:0 3px 0 #b9dcc4;color:var(--green-deep)}
.buy.on{background:var(--green);color:#fff;box-shadow:0 3px 0 var(--green-deep)}
.buy.poor{background:#eee8da;box-shadow:none;color:#a39b88}
.room{position:relative;border-radius:26px;overflow:hidden;box-shadow:0 6px 0 #d9c3a3;aspect-ratio:360/300;background:#f3d9b5}
.room > svg{position:absolute;inset:0;width:100%;height:100%}
.room .gd{position:absolute;left:50%;bottom:6%;width:30%;transform:translateX(-50%);animation:sway 2.4s ease-in-out infinite alternate}
@keyframes sway{to{transform:translateX(-50%) rotate(3deg)}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:800;border-radius:999px;padding:10px 18px;z-index:90;animation:up .2s;text-align:center;max-width:90vw}
.conf{position:fixed;z-index:95;pointer-events:none;font-size:26px;animation:fall 1.3s ease-in forwards}
@keyframes fall{to{transform:translateY(70vh) rotate(360deg);opacity:0}}
.flyt{position:fixed;z-index:96;pointer-events:none;font-weight:800;color:var(--cta-deep);font-size:22px;animation:flyup 1s ease-out forwards}

let unlocked = false, pend = null, AC = null;
function unlockAudio(){
  try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch (e) {}
  if (unlocked) return; unlocked = true;
  try { AUD.src = SILENT; const p = AUD.play(); if (p && p.catch) p.catch(() => { unlocked = false; }); } catch (e) { unlocked = false; }
}
['pointerdown', 'touchend', 'click', 'keydown'].forEach(ev => document.addEventListener(ev, unlockAudio, true));
function playFile(src, max = 7000){
  if (pend) { const f = pend; pend = null; f(); }
  return new Promise(res => {
    let done = false; const fin = () => { if (!done) { done = true; if (pend === fin) pend = null; res(); } }; pend = fin;
    try {
      AUD.pause(); AUD.onended = fin; AUD.onerror = fin; AUD.src = src;
      const p = AUD.play(); if (p && p.catch) p.catch(fin);
      setTimeout(fin, max);

}

    const o = AC.createOscillator(), g = AC.createGain(), s = AC.currentTime + when;
    o.type = type; o.frequency.value = f; g.gain.setValueAtTime(vol, s); g.gain.exponentialRampToValueAtTime(.001, s + t);
    o.connect(g); g.connect(AC.destination); o.start(s); o.stop(s + t + .02); } catch (e) {}
}

function stonePos(i, n){ const rowH = 100 / (n + 1); return { x: 50 + 30 * Math.sin(i * .9), y: 100 - (i + 1) * rowH }; }

  P.forEach((a, i) => {
    const p = stonePos(i, n), cls = i < S.step ? 'done' : i === S.step ? 'now' : 'lock', chest = a === 'CHEST';
    const lock = !allowed(a, i) && i >= S.step;
    const label = chest ? '🎁' : i < S.step ? '★' : i === S.step ? `<span class="ee">${A[a].e}</span>` : (lock ? '🔒' : i + 1);

function playFind(a, L){

    if (r >= rounds) return finish();
    let target; do { target = pick(set); } while (target === last && set.length > 1); last = target;
    const opts = shuffle([target, ...shuffle(set.filter(w => w !== target)).slice(0, nOpt - 1)]);
    const voiced = hasVoice(target), read = L >= 3 && r % 2 === 1;
    const x = W(target);
    $('gin').innerHTML = phead(rounds, r) + `
      <div class="ptitle"><h2>${esc(a.t)}</h2><p>${read ? 'Read the word and tap the picture' : voiced ? 'Listen and tap the picture' : 'Find: ' + esc(x.en)}</p></div>

      <button class="spk" id="sayB" aria-label="Listen" ${read ? 'style="width:56px;height:56px"' : ''}>${SPEAK}</button>
      <div class="scene ${a.th}"><div class="opts${nOpt === 2 ? ' c2' : nOpt === 4 ? ' c4' : ''}">${opts.map(w => `<button class="opt" data-w="${w}">${picOf(w)}<span class="cap"></span></button>`).join('')}</div></div>`;
    bindX();
    const sayB = $('sayB'), sayIt = () => talk(sayB, voiced ? sayWord(target) : sayEn('yourturn'));
    sayB.onclick = sayIt;
    let missed = false, locked = false;
    $('gin').querySelectorAll('.opt').forEach(b => b.onclick = () => {
      if (locked) return;
      const w = b.dataset.w, y = W(w);
      b.querySelector('.cap').innerHTML = `${esc(y.mg)}<small>${esc(y.en)}</small>`;
      if (w === target) { locked = true; b.classList.add('right'); score(!missed);
        rightAnswer(b, !missed).then(() => sayWord(target)).then(() => { r++; setTimeout(round, 400); });
      } else { missed = true; wrongAnswer(b); setTimeout(sayIt, 450); }
    });
    if (!read) setTimeout(sayIt, 300);
  };
  if (a.th === 'garden') sayEn('howfeel').then(round); else round();
}

/* 2. market shopping (from age 5 the list is written, not pictures) */
function playMarket(a, L){
  const lists = 2, listN = [2,3,3,4,4][L], readList = L >= 3; let li = 0;
  const one = () => {
    if (!playing) return;
    if (li >= lists) return finish();
    const shelf = shuffle(SETS[a.set]).slice(0, listN <= 2 ? 4 : 6), need = shuffle(shelf).slice(0, listN), got = new Set();
    let missed = false;
    $('gin').innerHTML = phead(lists, li) + `
      <div class="ptitle"><h2>Market shopping</h2><p>${readList ? 'Read the lisitra (list).' : 'Look at the lisitra (list).'} Put those things in the harona (basket).</p></div>
      <div class="list"><span class="lt">lisitra<small>list</small></span>${need.map(w => readList ? `<button class="it word" data-l="${w}">${esc(W(w).mg)}</button>` : `<button class="it" data-l="${w}">${picOf(w)}</button>`).join('')}</div>
      <div class="scene market"><div class="shelfg">${shelf.map(w => `<button class="opt" data-w="${w}">${picOf(w)}</button>`).join('')}</div></div>
      <div class="basket"><span class="bk" id="bk">${hasPhoto('harona') ? '<img src="harona.webp" alt="basket">' : '<span style="font-size:60px">🧺</span>'}</span><span id="bkN">0 / ${need.length}</span></div>`;
    bindX();
    $('gin').querySelectorAll('.list .it').forEach(s => s.onclick = () => sayWord(s.dataset.l));
    $('gin').querySelectorAll('.shelfg .opt').forEach(b => b.onclick = () => {
      const w = b.dataset.w;
      if (need.includes(w) && !got.has(w)) {
        got.add(w); ding(); addTickets(1); playing.earned++; flyTicket(b); sayWord(w); score(true);
        b.classList.add('gone'); const bk = $('bk'); bk.classList.remove('bump'); void bk.offsetWidth; bk.classList.add('bump');
        $('bkN').textContent = `${got.size} / ${need.length}`;
        $('gin').querySelector(`.it[data-l="${w}"]`).classList.add('got');
        if (got.size === need.length) setTimeout(pay, 900);
      } else if (!got.has(w)) { missed = true; score(false); wrongAnswer(b); sayWord(w); }
    });
    sayWord('lisitra');
    const pay = () => {
      if (!playing) return;
      $('gin').innerHTML = phead(lists, li) + `<div class="ptitle"><h2>Time to pay!</h2><p>Tap the vola (money) to pay for your basket.</p></div>
        <button class="opt" id="payB" style="width:58%;align-self:center">${picOf('vola')}<span class="cap">vola<small>money</small></span></button>`;
      bindX(); sayWord('vola');
      $('payB').onclick = () => { chaching(); $('payB').classList.add('right'); playFile('en-' + pick(PRAISE) + '.mp3', 2500).then(() => { li++; one(); }); };
    };
  };
  one();
}

/* 3. listen and paint */
const SHAPE_SVG = { boribory:'<circle class="fillme" cx="50" cy="50" r="40"/>', efamira:'<rect class="fillme" x="12" y="12" width="76" height="76" rx="4"/>', telozoro:'<path class="fillme" d="M50 8L92 88H8z"/>', mahitsizoro:'<rect class="fillme" x="4" y="24" width="92" height="52" rx="4"/>' };
function playPaint(a, L){
  const all = SETS[a.set], nPot = Math.min(all.length, [2,3,4,4,5][L]), rounds = 4, sayShape = a.sayShape || L >= 2, read = L >= 3;
  let r = 0, lastC = null;
  const round = () => {
    if (!playing) return;
    if (r >= rounds) return finish();
    let c; do { c = pick(all); } while (c === lastC && all.length > 1); lastC = c;
    const shape = a.shapes[r % a.shapes.length];
    const pots = shuffle([c, ...shuffle(all.filter(x => x !== c)).slice(0, nPot - 1)]);
    $('gin').innerHTML = phead(rounds, r) + `
      <div class="ptitle"><h2>${esc(a.t)}</h2><p>${read ? 'Read or listen, then tap the paint' : 'Listen to the color, then tap the paint'}</p></div>
      ${read ? `<div class="readw small">${esc(W(shape).mg)} ${esc(W(c).mg)}</div>` : ''}
      <button class="spk" id="sayB" aria-label="Listen">${SPEAK}</button>
      <div class="canvasbox"><svg viewBox="0 0 100 100"><g fill="#fff" stroke="#1f2a44" stroke-width="3" stroke-dasharray="6 5">${SHAPE_SVG[shape]}</g></svg></div>
      <p id="shapeCap" style="text-align:center;margin:-4px 0 0;font-weight:800;min-height:1.3em"></p>
      <div class="pots">${pots.map(p => `<button class="pot" data-c="${p}" style="background:${W(p).color}" aria-label="paint"></button>`).join('')}</div>`;
    bindX();
    const sayB = $('sayB'), sayIt = () => talk(sayB, (sayShape ? sayWord(shape) : Promise.resolve()).then(() => sayWord(c)));
    sayB.onclick = sayIt;
    let missed = false, locked = false;
    $('gin').querySelectorAll('.pot').forEach(b => b.onclick = () => {
      if (locked) return;
      if (b.dataset.c === c) {
        locked = true; b.classList.add('right'); score(!missed);
        const f = $('gin').querySelector('.fillme'); f.style.fill = W(c).color; f.parentNode.setAttribute('stroke-dasharray', '0');
        $('shapeCap').innerHTML = `${esc(W(shape).mg)} ${esc(W(c).mg)} <span style="color:var(--soft)">- ${esc(W(c).en)} ${esc(W(shape).en)}</span>`;
        rightAnswer(b, !missed).then(() => { r++; setTimeout(round, 600); });
      } else { missed = true; wrongAnswer(b); sayWord(b.dataset.c).then(() => setTimeout(sayIt, 300)); }
    });
    setTimeout(sayIt, 300);
  };
  round();
}

/* 4. memory pairs (from age 5: match the picture with the written word) */
function playMemory(a, L){
  const pairs = Math.min(SETS[a.set].length, [2,3,3,4,4][L]), words = shuffle(SETS[a.set]).slice(0, pairs), readMode = L >= 3;
  const cards = shuffle([...words.map(w => ({ w, t:'p' })), ...words.map(w => ({ w, t: readMode ? 'w' : 'p' }))]);
  let open = [], matched = 0, busy = false, flips = 0;
  const cols = cards.length <= 4 ? ' c2' : cards.length >= 8 ? ' c4' : '';
  $('gin').innerHTML = phead(pairs, 0) + `
    <div class="ptitle"><h2>${esc(a.t)}</h2><p>${readMode ? 'Match each picture with its word' : 'Turn two cards. Find the pairs!'}</p></div>
    <div class="mem${cols}">${cards.map(c => `<button class="card" data-w="${c.w}"><span class="f"><span class="s back">${gidro({})}</span><span class="s front">${c.t === 'w' ? `<span class="wd">${esc(W(c.w).mg)}</span>` : picOf(c.w)}</span></span></button>`).join('')}</div>`;
  bindX(); sayEn('matchpairs');
  $('gin').querySelectorAll('.card').forEach(c => c.onclick = () => {
    if (busy || c.classList.contains('open') || c.classList.contains('ok')) return;
    c.classList.add('open'); tone(660, .08); sayWord(c.dataset.w); open.push(c);
    if (open.length === 2) {
      busy = true; flips++; const [x, y] = open;
      if (x.dataset.w === y.dataset.w) {
        setTimeout(() => { x.classList.add('ok'); y.classList.add('ok'); matched++; score(true); rightAnswer(y, true);
          const d = $('gin').querySelectorAll('.dots i'); if (d[matched - 1]) d[matched - 1].classList.add('on');
          open = []; busy = false; if (matched === words.length) setTimeout(finish, 1400); }, 500);
      } else { setTimeout(() => { x.classList.remove('open'); y.classList.remove('open'); open = []; busy = false; }, 1100); if (flips > pairs * 2) score(false); }
    }
  });
}

/* 5. music and movement (the same 6 actions as Gidro School) */
let mvStop = false;
function playMove(){
  const acts = [ { v:'jump', t:'Jump!', e:'🦘' }, { v:'clap', t:'Clap your hands!', e:'👏🏾' }, { v:'turn', t:'Turn around!', e:'🔄' },

  mvStop = false; const tune = [523, 659, 784, 659, 587, 698, 880, 698]; let i = 0;
  const step = async () => {
    if (mvStop || !playing) return;
    if (i >= acts.length) { sayEn('mvend'); return finish(); }
    const x = acts[i];
    $('gin').innerHTML = phead(acts.length, i) + `<div class="mv"><div class="big">${x.e}</div><h3>${x.t}</h3><div class="cnt" id="cnt">5</div></div>`;

};
const WEARPREV = { bow:{head:'bow'}, hat:{head:'hat'}, crown:{head:'crown'}, glasses:{eyes:'glasses'}, lamba:{neck:'lamba'}, medal:{neck:'medal'} };
let shopTab = 'wear';
function drawShop(){
  $('shopGuide').innerHTML = chrPic('tiana');
  $('tabWear').setAttribute('aria-pressed', shopTab === 'wear'); $('tabRoom').setAttribute('aria-pressed', shopTab === 'room');
  $('items').innerHTML = ITEMS.filter(it => it.tab === shopTab).map(it => {
    const own = S.owned.includes(it.id), on = it.tab === 'wear' ? S.wear[it.slot] === it.id : S.room.includes(it.id);
    const prev = it.tab === 'wear' ? gidro(WEARPREV[it.id]) : `<svg viewBox="0 0 360 300" aria-hidden="true">${ROOMART[it.id]}</svg>`;
    const btn = !own ? `<button class="buy${S.tickets < it.price ? ' poor' : ''}" data-buy="${it.id}">${TICKET} ${it.price}</button>`
      : `<button class="buy ${on ? 'on' : 'own'}" data-use="${it.id}">${on ? (it.tab === 'wear' ? 'Wearing ✓' : 'In the room ✓') : (it.tab === 'wear' ? 'Put on' : 'Put in room')}</button>`;
    return `<div class="item"><div class="iv">${prev}</div><b>${esc(it.en)}${it.mg ? `<small>${esc(it.mg)}</small>` : ''}</b>${btn}</div>`;
  }).join('');
  $('items').querySelectorAll('[data-buy]').forEach(b => b.onclick = () => buy(b.dataset.buy));
  $('items').querySelectorAll('[data-use]').forEach(b => b.onclick = () => useItem(b.dataset.use));
}
function buy(id){
  const it = ITEMS.find(x => x.id === id);
  if (S.tickets < it.price) { boop(); toast(`You need ${it.price - S.tickets} more tickets. Tap Play to earn more!`); return; }
  S.tickets -= it.price; S.owned.push(id); chaching(); confetti(10); useItem(id, true);
  toast(it.tab === 'wear' ? 'Gidro loves it!' : 'Added to Gidro’s room!');
}
function useItem(id, forceOn){
  const it = ITEMS.find(x => x.id === id);
  if (it.tab === 'wear') S.wear[it.slot] = (S.wear[it.slot] === id && !forceOn) ? null : id;
  else { const k = S.room.indexOf(id); if (k >= 0 && !forceOn) S.room.splice(k, 1); else if (k < 0) S.room.push(id); }
  save(); refreshTop(); drawShop();
}
$('tabWear').onclick = () => { shopTab = 'wear'; drawShop(); };
$('tabRoom').onclick = () => { shopTab = 'room'; drawShop(); };

     <rect x="24" y="40" width="80" height="80" rx="40" fill="#9edcf0" stroke="#8c5430" stroke-width="6"/><path d="M64 40v80M24 80h80" stroke="#8c5430" stroke-width="4"/><circle cx="84" cy="62" r="8" fill="#ffd166"/>

}
